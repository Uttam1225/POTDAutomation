name: POTD Daily Automation

on:
  schedule:
    # 3:00 AM IST = 21:30 UTC
    - cron: '30 21 * * *'
  workflow_dispatch:   # allow manual trigger from GitHub UI

jobs:
  solve-potd:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install Playwright browsers
        run: mvn -q exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium"

      - name: Run POTD automation
        env:
          GFG_USERNAME:  ${{ secrets.GFG_USERNAME }}
          GFG_PASSWORD:  ${{ secrets.GFG_PASSWORD }}
          GITHUB_TOKEN:  ${{ secrets.GITHUB_TOKEN }}
          GFG_HEADLESS:  "true"
        run: mvn test

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_id }}
          path: target/screenshots/
          retention-days: 7

      - name: Upload Cucumber report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report-${{ github.run_id }}
          path: target/cucumber-reports/
          retention-days: 7
